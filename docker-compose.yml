services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  rag-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant
    restart: always
    volumes:
      - rag_cache:/app/.cache

  # Retrieve / chat / status — keep PPID and public Traefik on this port.
  # Uses EMBEDDER_* from .env (prefer local/host Ollama so Tanya Dokumen survives GPU downtime).
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "13121:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - qdrant
    restart: always
    volumes:
      - rag_cache:/app/.cache
      - rag_uploads:/app/uploads

  # Heavy ingest / file writes — point n8n reconcile here so retrieve stays responsive.
  # EMBEDDER_BASE_URL is overridden via INGEST_EMBEDDER_BASE_URL (GPU Ollama / mark-7).
  # If unset, defaults to mark-7 Tailscale; set INGEST_EMBEDDER_BASE_URL in .env to change.
  rag-api-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "13123:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      EMBEDDER_BASE_URL: ${INGEST_EMBEDDER_BASE_URL:-http://100.76.102.104:11434}
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - qdrant
    restart: always
    volumes:
      - rag_cache:/app/.cache
      - rag_uploads:/app/uploads

volumes:
  qdrant_storage:
  rag_cache:
  rag_uploads:
